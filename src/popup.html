<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bitbucket Artifact Previewer</title>
  <style>
    :root {
      --primary-color: #0052CC; /* Bitbucket Blue */
      --accent-color: #FF8B00;  /* Warning/Accent Orange */
      --donate-color: #FFDD00;  /* Buy me a coffee Yellow */
      --donate-text: #000000;
      --bg-color: #ffffff;
      --text-color: #333238;
      --border-color: #dbdbdb;
      --font-family: "Segoe UI", Roboto, sans-serif;

      body {
        font-family: var(--font-family), sans-serif;
        width: 300px;
        margin: 0;
        padding: 16px;
        background-color: var(--bg-color);
        color: var(--text-color);

        header {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          margin-bottom: 16px;

          h2 {
            font-size: 16px;
            margin: 0;
            color: var(--text-color);
          }
        }

        .btn {
          width: 100%;
          padding: 10px;
          border: none;
          border-radius: 4px;
          font-weight: 600;
          font-size: 13px;
          cursor: pointer;
          text-align: center;
          text-decoration: none;
          transition: background-color 0.2s, transform 0.1s;
          box-sizing: border-box;

          &:active {
            transform: translateY(1px);
          }
        }

        .btn-donate {
          background-color: var(--donate-color);
          color: var(--donate-text);
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          margin-top: 8px;
          border: 1px solid #E5C700;

          &:hover {
            background-color: #E6C700;
          }
        }
      }

      footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #eee;
        text-align: center;
        font-size: 11px;
        color: #999;

        a {
          text-decoration: none;
          color: var(--primary-color);
        }
      }
    }
  </style>
</head>

<body>
  <header>
    <img src="../icons/icon32.png" alt="Bitbucket Artifact Previewer Logo" />
    <h2>Bitbucket Artifact Previewer</h2>
  </header>

  <a href="https://www.buymeacoffee.com/dmoyadev" target="_blank" class="btn btn-donate">
    <span>💸</span> less "thanks" and more "take this 2€"
  </a>

  <footer>
    Want to propose a feature or raise a bug?
    <br>
    <a href="https://github.com/dmoyadev/extension-bitbucket-artifact-previewer" target="_blank"><strong>Check GitHub</strong></a>
    <br>
    <br>
    Made with 💚 by <a href="https://github.com/dmoyadev" target="_blank"><strong>Daniel Moya</strong></a>
  </footer>
</body>
</html>
